kind = "mobile"
previewPath = "/"
title = "EarnIQ"
version = "1.0.0"
id = "artifacts/earniq"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 26210

[services.development]
run = "pnpm --filter @workspace/earniq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/earniq", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/earniq", "run", "serve" ]

[services.env]
PORT = "26210"
BASE_PATH = "/"
